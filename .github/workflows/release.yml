name: Release

# Pushing a tag like v0.1.0 (or v0.1.0-rc.1) builds every binary with
# GoReleaser and creates a draft GitHub Release to review and publish.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # macOS: the tray needs cgo there; Linux and Windows builds cross-compile.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # GoReleaser reads tags and history
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: publishes the Homebrew cask (final releases only).
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          # Optional: Developer ID signing + notarization (see .goreleaser.yaml).
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
      - name: Verify macOS signatures
        env:
          NOTARIZED: ${{ secrets.MACOS_SIGN_P12 != '' }}
        run: |
          set -e
          for bin in dist/*darwin*/h2ams dist/*darwin*/h2ams-tray; do
            codesign --verify --strict "$bin"
            if [ "$NOTARIZED" = "true" ]; then
              info=$(codesign -dvv "$bin" 2>&1)
              echo "$info" | grep -q "Authority=Developer ID Application" \
                || { echo "$bin is not Developer ID signed"; exit 1; }
              echo "$info" | grep -q "(runtime)" \
                || { echo "$bin lacks the hardened runtime"; exit 1; }
              echo "developer-id signed: $bin"
            else
              echo "ad-hoc signed: $bin"
            fi
          done
